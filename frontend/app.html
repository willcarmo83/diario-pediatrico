<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diário Pediátrico</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<script>
  window.onerror = function (msg, url, line) {
    document.getElementById("root").innerHTML =
      '<div style="font-family:monospace;padding:24px;color:#B5473A;white-space:pre-wrap;">Erro ao carregar o app:\n' +
      msg + '\n(linha ' + line + ')</div>';
  };
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #F3F6F4; }
  body { font-family: 'Inter', -apple-system, sans-serif; color: #1B2A28; }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  button { cursor: pointer; border: none; font-family: inherit; }
  input { font-family: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #2F7D6F; outline-offset: 2px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #DDE3E0; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const C = {
  bg: "#F3F6F4", surface: "#FFFFFF", surfaceAlt: "#EAF0ED",
  ink: "#1B2A28", inkSoft: "#5B6D6A", inkFaint: "#93A19E",
  teal: "#2F7D6F", tealDark: "#1F5B50", tealTint: "#E3F0EC",
  amber: "#C97A3D", amberDark: "#A15F2C", amberTint: "#F7EAE0",
  indigo: "#3E5C9A", line: "#DDE3E0", rose: "#B5473A"
};
const AGUA_OPTS = [
  { key: "copo_cheio", label: "Copo cheio" },
  { key: "meio_copo", label: "Meio copo" },
  { key: "gole", label: "Um gole" },
];
const BANHEIRO_OPTS = [
  { key: "urina", label: "Fez xixi" },
  { key: "fezes", label: "Fez cocô" },
  { key: "ambos", label: "Os dois" },
];
function fmtTime(d) { return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
function fmtDateLong(d) { return d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" }); }
function age(bd) {
  const b = new Date(bd), now = new Date();
  let y = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) y--;
  return y;
}

/* ---------- camada de API ---------- */
function useApi(apiBase, token, onAuthError) {
  return useCallback(async (path, options = {}) => {
    const res = await fetch(apiBase + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: "Bearer " + token } : {}),
        ...(options.headers || {}),
      },
    });
    if (res.status === 401) { onAuthError(); throw new Error("Sessão expirada"); }
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Erro na requisição");
    return data;
  }, [apiBase, token, onAuthError]);
}

/* ---------- atoms ---------- */
function Toast({ message, error }) {
  if (!message) return null;
  return (
    <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
      background: error ? C.rose : C.ink, color: "#fff", padding: "10px 18px", borderRadius: 10, fontSize: 14,
      boxShadow: "0 8px 24px rgba(0,0,0,0.18)", zIndex: 50, maxWidth: "80vw" }}>{message}</div>
  );
}
function StatCard({ label, value, color, tint }) {
  return (
    <div style={{ background: tint, borderRadius: 12, padding: "12px 10px" }}>
      <div className="serif" style={{ fontSize: 19, fontWeight: 700, color }}>{value}</div>
      <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 2 }}>{label}</div>
    </div>
  );
}
function PeriodToggle({ value, onChange, options }) {
  return (
    <div style={{ display: "inline-flex", background: C.surfaceAlt, borderRadius: 999, padding: 3 }}>
      {options.map(([key, label]) => (
        <button key={key} onClick={() => onChange(key)} style={{
          padding: "7px 14px", borderRadius: 999, fontSize: 13, fontWeight: 600,
          background: value === key ? C.surface : "transparent", color: value === key ? C.ink : C.inkSoft }}>{label}</button>
      ))}
    </div>
  );
}
function BarChart({ data, xKey, colorA, colorB }) {
  const max = Math.max(1, ...data.map(d => Math.max(d.agua || 0, d.banheiro || 0)));
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 190, borderBottom: `1px solid ${C.line}`, padding: "0 4px" }}>
        {data.map((d, i) => (
          <div key={i} title={`${d[xKey]}: água ${d.agua||0} / banheiro ${d.banheiro||0}`} style={{ flex: 1, display: "flex", gap: 1, alignItems: "flex-end", height: "100%" }}>
            <div style={{ flex: 1, height: `${((d.agua||0)/max)*100}%`, background: colorA, borderRadius: "2px 2px 0 0", minHeight: d.agua?2:0 }} />
            <div style={{ flex: 1, height: `${((d.banheiro||0)/max)*100}%`, background: colorB, borderRadius: "2px 2px 0 0", minHeight: d.banheiro?2:0 }} />
          </div>
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: C.inkFaint, marginTop: 4 }}>
        <span>{data[0]?.[xKey]}</span><span>{data[data.length-1]?.[xKey]}</span>
      </div>
      <div style={{ display: "flex", gap: 16, marginTop: 10, fontSize: 12, color: C.inkSoft }}>
        <span><span style={{display:"inline-block",width:9,height:9,borderRadius:2,background:colorA,marginRight:5}}/>Água</span>
        <span><span style={{display:"inline-block",width:9,height:9,borderRadius:2,background:colorB,marginRight:5}}/>Banheiro</span>
      </div>
    </div>
  );
}
function TrendRow({ label, pct }) {
  const dir = pct > 2 ? "up" : pct < -2 ? "down" : "flat";
  const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "—";
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0", borderBottom: `1px solid ${C.line}` }}>
      <span style={{ fontSize: 14, color: C.inkSoft }}>{label}</span>
      <span style={{ fontSize: 14, fontWeight: 600, color: dir==="flat"?C.inkSoft:C.indigo }}>
        {arrow} {dir === "flat" ? "estável" : `${pct>0?"+":""}${pct}% vs. período anterior`}
      </span>
    </div>
  );
}
function LoggerCard({ emoji, title, color, tint, open, onToggle, options, onPick }) {
  return (
    <div style={{ borderRadius: 16, border: `1px solid ${C.line}`, overflow: "hidden", background: C.surface }}>
      <button onClick={onToggle} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 18px", background: open ? tint : C.surface }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 40, height: 40, borderRadius: 12, background: tint, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>{emoji}</div>
          <span className="serif" style={{ fontSize: 17, fontWeight: 600 }}>{title}</span>
        </div>
        <span style={{ color: C.inkFaint, transform: open ? "rotate(90deg)" : "none", display:"inline-block", transition:"transform .15s" }}>›</span>
      </button>
      {open && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, padding: "0 18px 18px" }}>
          {options.map(o => (
            <button key={o.key} onClick={() => onPick(o.key)} style={{ padding: "10px 16px", borderRadius: 999, background: C.surface, border: `1.5px solid ${color}`, color, fontWeight: 600, fontSize: 13.5 }}>{o.label}</button>
          ))}
        </div>
      )}
    </div>
  );
}
function EditModal({ entry, onCancel, onSave }) {
  const opts = entry.type === "AGUA" ? AGUA_OPTS : BANHEIRO_OPTS;
  const [subtype, setSubtype] = useState(entry.subtype);
  const d = new Date(entry.timestamp);
  const [time, setTime] = useState(`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`);
  function handleSave() {
    const [h, m] = time.split(":").map(Number);
    const nd = new Date(entry.timestamp); nd.setHours(h, m);
    onSave(entry.id, { subtype, timestamp: nd.toISOString() });
  }
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(27,42,40,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 20 }}>
      <div style={{ background: C.surface, borderRadius: 16, padding: 22, width: "100%", maxWidth: 340 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
          <span className="serif" style={{ fontSize: 17, fontWeight: 600 }}>Editar registro</span>
          <button onClick={onCancel} style={{ background: "none", color: C.inkSoft, fontSize: 16 }}>✕</button>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
          {opts.map(o => (
            <button key={o.key} onClick={() => setSubtype(o.key)} style={{ padding: "8px 14px", borderRadius: 999, fontSize: 13, fontWeight: 600,
              background: subtype === o.key ? C.teal : C.surfaceAlt, color: subtype === o.key ? "#fff" : C.inkSoft }}>{o.label}</button>
          ))}
        </div>
        <label style={{ fontSize: 12.5, color: C.inkSoft }}>Horário</label>
        <input type="time" value={time} onChange={e => setTime(e.target.value)} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, marginTop: 4, marginBottom: 18 }} />
        <button onClick={handleSave} style={{ width: "100%", padding: 11, borderRadius: 10, background: C.teal, color: "#fff", fontWeight: 600, fontSize: 14 }}>Salvar alterações</button>
      </div>
    </div>
  );
}

/* ---------- tela de login ---------- */
function LoginScreen({ apiBase, setApiBase, onLogin }) {
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [role, setRole] = useState("RESPONSAVEL");
  const [inviteCode, setInviteCode] = useState("");
  const [parentesco, setParentesco] = useState("MAE");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const [showConfig, setShowConfig] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setErr(""); setLoading(true);
    try {
      const path = mode === "login" ? "/auth/login" : "/auth/register";
      const body = mode === "login" ? { email, password } : { name, email, password, role, inviteCode };
      const res = await fetch(apiBase + path, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Falha");
      if (mode === "register" && role === "RESPONSAVEL" && parentesco) {
        // guarda a preferência de parentesco pra usar quando cadastrar o primeiro filho
        sessionStorage.setItem("parentesco_padrao", parentesco);
      }
      onLogin(data.user, data.token);
    } catch (e2) {
      setErr(e2.message === "Failed to fetch" ? `Não consegui falar com a API em ${apiBase}. Ela está rodando?` : e2.message);
    } finally { setLoading(false); }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 360 }}>
        <div className="serif" style={{ fontSize: 26, fontWeight: 600, color: C.tealDark, textAlign: "center", marginBottom: 4 }}>
          diário <span style={{ color: C.ink }}>pediátrico</span>
        </div>
        <div style={{ display: "flex", justifyContent: "center", gap: 4, marginBottom: 20 }}>
          <button onClick={()=>setMode("login")} style={{ padding: "6px 14px", borderRadius: 999, fontSize: 13, fontWeight: 600, background: mode==="login"?C.surfaceAlt:"transparent", color: mode==="login"?C.ink:C.inkFaint }}>Entrar</button>
          <button onClick={()=>setMode("register")} style={{ padding: "6px 14px", borderRadius: 999, fontSize: 13, fontWeight: 600, background: mode==="register"?C.surfaceAlt:"transparent", color: mode==="register"?C.ink:C.inkFaint }}>Criar conta</button>
        </div>
        <form onSubmit={submit} style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: 22, display: "flex", flexDirection: "column", gap: 10 }}>
          {mode === "register" && (
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="seu nome" required
              style={{ padding: "10px 12px", borderRadius: 9, border: `1px solid ${C.line}`, fontSize: 14 }} />
          )}
          <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="email" type="email" required
            style={{ padding: "10px 12px", borderRadius: 9, border: `1px solid ${C.line}`, fontSize: 14 }} />
          <input value={password} onChange={e=>setPassword(e.target.value)} placeholder="senha" type="password" required
            style={{ padding: "10px 12px", borderRadius: 9, border: `1px solid ${C.line}`, fontSize: 14 }} />
          {mode === "register" && (
            <>
              <select value={role} onChange={e=>setRole(e.target.value)} style={{ padding: "10px 12px", borderRadius: 9, border: `1px solid ${C.line}`, fontSize: 14 }}>
                <option value="RESPONSAVEL">Sou responsável (pai/mãe)</option>
                <option value="CLINICA">Sou da equipe da clínica</option>
              </select>
              {role === "RESPONSAVEL" && (
                <select value={parentesco} onChange={e=>setParentesco(e.target.value)} style={{ padding: "10px 12px", borderRadius: 9, border: `1px solid ${C.line}`, fontSize: 14 }}>
                  <option value="MAE">Sou a mãe</option>
                  <option value="PAI">Sou o pai</option>
                  <option value="OUTRO">Outro responsável</option>
                </select>
              )}
              {role === "CLINICA" && (
                <input value={inviteCode} onChange={e=>setInviteCode(e.target.value)} placeholder="código de convite da clínica" required
                  style={{ padding: "10px 12px", borderRadius: 9, border: `1px solid ${C.line}`, fontSize: 14 }} />
              )}
            </>
          )}
          {err && <div style={{ color: C.rose, fontSize: 12.5 }}>{err}</div>}
          <button disabled={loading} type="submit" style={{ padding: 11, borderRadius: 10, background: C.teal, color: "#fff", fontWeight: 600, fontSize: 14, opacity: loading?0.7:1 }}>
            {loading ? "Aguarde..." : mode === "login" ? "Entrar" : "Criar conta"}
          </button>
        </form>
        <button onClick={()=>setShowConfig(!showConfig)} style={{ background: "none", color: C.inkFaint, fontSize: 12, marginTop: 14, width: "100%" }}>
          {showConfig ? "ocultar" : "endereço da API"}: {apiBase}
        </button>
        {showConfig && (
          <input value={apiBase} onChange={e=>setApiBase(e.target.value)} style={{ width: "100%", marginTop: 8, padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 12.5 }} />
        )}
      </div>
    </div>
  );
}

/* ---------- app principal ---------- */
function App() {
  const [apiBase, setApiBase] = useState(localStorage.getItem("api_base") || "http://localhost:3333");
  const [user, setUser] = useState(null);
  const [token, setToken] = useState(sessionStorage.getItem("token") || null);
  const [toast, setToast] = useState({ msg: "", error: false });
  const [children, setChildren] = useState([]);
  const [activeChildId, setActiveChildId] = useState(null);
  const [entries, setEntries] = useState([]);
  const [tab, setTab] = useState("registrar");
  const [openLogger, setOpenLogger] = useState(null);
  const [editingEntry, setEditingEntry] = useState(null);
  const [clientPeriod, setClientPeriod] = useState("diario");
  const [adminPeriod, setAdminPeriod] = useState("mensal");
  const [monthlyData, setMonthlyData] = useState([]);
  const [annualData, setAnnualData] = useState([]);
  const [dailyTotals, setDailyTotals] = useState({ agua: 0, urina: 0, fezes: 0 });
  const [diagnostico, setDiagnostico] = useState(null);
  const [adminSearch, setAdminSearch] = useState("");
  const [showAddChild, setShowAddChild] = useState(false);
  const [newChild, setNewChild] = useState({ name: "", birthdate: "", parentesco: sessionStorage.getItem("parentesco_padrao") || "MAE" });
  const [showAddGuardian, setShowAddGuardian] = useState(false);
  const [newGuardian, setNewGuardian] = useState({ email: "", parentesco: "PAI" });
  const eventSourceRef = useRef(null);

  useEffect(() => { localStorage.setItem("api_base", apiBase); }, [apiBase]);
  useEffect(() => {
    const u = sessionStorage.getItem("user");
    if (u && token) setUser(JSON.parse(u));
  }, []);

  const showToast = useCallback((msg, error=false) => { setToast({ msg, error }); setTimeout(()=>setToast({msg:"",error:false}), 2600); }, []);
  const handleAuthError = useCallback(() => { logout(); showToast("Sessão expirada, faça login de novo.", true); }, []);
  const api = useApi(apiBase, token, handleAuthError);

  function handleLogin(u, t) {
    setUser(u); setToken(t);
    sessionStorage.setItem("token", t); // sessionStorage: some junto quando a aba fecha (mais seguro que localStorage)
    sessionStorage.setItem("user", JSON.stringify(u));
  }
  function logout() {
    setUser(null); setToken(null); setChildren([]); setActiveChildId(null);
    sessionStorage.removeItem("token"); sessionStorage.removeItem("user");
  }

  // carrega crianças ao logar
  useEffect(() => {
    if (!user) return;
    api("/children").then(list => { setChildren(list); setActiveChildId(list[0]?.id ?? null); })
      .catch(e => showToast(e.message, true));
  }, [user]);

  const loadEntries = useCallback(() => {
    if (!activeChildId) return;
    api(`/children/${activeChildId}/entries`).then(setEntries).catch(e => showToast(e.message, true));
  }, [activeChildId, api]);
  const loadDaily = useCallback(() => {
    if (!activeChildId) return;
    api(`/children/${activeChildId}/dashboard?period=diario`).then(setDailyTotals).catch(()=>{});
  }, [activeChildId, api]);
  const loadMonthly = useCallback(() => {
    if (!activeChildId) return;
    api(`/children/${activeChildId}/dashboard?period=mensal`).then(d => setMonthlyData(d.series)).catch(()=>{});
  }, [activeChildId, api]);
  const loadAnnual = useCallback(() => {
    if (!activeChildId) return;
    api(`/children/${activeChildId}/dashboard?period=anual`).then(d => setAnnualData(d.series)).catch(()=>{});
  }, [activeChildId, api]);
  const loadDiagnostico = useCallback(() => {
    if (!activeChildId) return;
    api(`/children/${activeChildId}/diagnostico`).then(setDiagnostico).catch(()=>{});
  }, [activeChildId, api]);

  useEffect(() => { loadEntries(); loadDaily(); loadMonthly(); loadAnnual(); loadDiagnostico(); }, [activeChildId]);

  // tempo real: qualquer registro criado/editado/apagado por OUTRO responsável aparece na hora
  useEffect(() => {
    if (!activeChildId || !token) return;
    if (eventSourceRef.current) eventSourceRef.current.close();
    const es = new EventSource(`${apiBase}/children/${activeChildId}/entries/stream?token=${token}`);
    es.addEventListener("created", () => { loadEntries(); loadDaily(); loadMonthly(); });
    es.addEventListener("updated", () => { loadEntries(); loadDaily(); loadMonthly(); });
    es.addEventListener("deleted", () => { loadEntries(); loadDaily(); loadMonthly(); });
    eventSourceRef.current = es;
    return () => es.close();
  }, [activeChildId, token]);

  async function addEntry(type, subtype) {
    try {
      await api(`/children/${activeChildId}/entries`, { method: "POST", body: JSON.stringify({ type, subtype }) });
      setOpenLogger(null);
      const label = type === "AGUA" ? AGUA_OPTS.find(o=>o.key===subtype).label : BANHEIRO_OPTS.find(o=>o.key===subtype).label;
      showToast(`Registrado: ${label}`);
      loadEntries(); loadDaily(); loadMonthly();
    } catch (e) { showToast(e.message, true); }
  }
  async function saveEditedEntry(id, changes) {
    try {
      await api(`/entries/${id}`, { method: "PUT", body: JSON.stringify(changes) });
      setEditingEntry(null); showToast("Registro atualizado"); loadEntries(); loadDaily(); loadMonthly();
    } catch (e) { showToast(e.message, true); }
  }
  async function deleteEntry(id) {
    try { await api(`/entries/${id}`, { method: "DELETE" }); showToast("Registro removido"); loadEntries(); loadDaily(); loadMonthly(); }
    catch (e) { showToast(e.message, true); }
  }
  async function addChild() {
    try {
      const created = await api("/children", { method: "POST", body: JSON.stringify(newChild) });
      setChildren([...children, { ...created, meuParentesco: newChild.parentesco }]);
      setNewChild({ name: "", birthdate: "", parentesco: "MAE" }); setShowAddChild(false);
      showToast("Criança cadastrada");
    } catch (e) { showToast(e.message, true); }
  }
  async function addGuardian() {
    try {
      const r = await api(`/children/${activeChildId}/guardians`, { method: "POST", body: JSON.stringify(newGuardian) });
      showToast(r.message); setShowAddGuardian(false); setNewGuardian({ email: "", parentesco: "PAI" });
    } catch (e) { showToast(e.message, true); }
  }

  const activeChild = children.find(c => c.id === activeChildId);
  const filteredChildren = children.filter(c => (c.name||"").toLowerCase().includes(adminSearch.toLowerCase()));

  const historyByDay = useMemo(() => {
    const groups = {};
    entries.forEach(e => { const key = new Date(e.timestamp).toDateString(); (groups[key]=groups[key]||[]).push(e); });
    return Object.entries(groups).sort((a,b)=>new Date(b[0])-new Date(a[0])).slice(0,7)
      .map(([k,list]) => [new Date(k), list.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))]);
  }, [entries]);

  if (!user) return <LoginScreen apiBase={apiBase} setApiBase={setApiBase} onLogin={handleLogin} />;

  return (
    <div style={{ minHeight: "100vh", paddingBottom: 40 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "20px 24px", flexWrap: "wrap", gap: 12 }}>
        <div className="serif" style={{ fontSize: 22, fontWeight: 600, color: C.tealDark }}>diário <span style={{color:C.ink}}>pediátrico</span></div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 13, color: C.inkSoft }}>{user.name} · {user.role === "CLINICA" ? "clínica" : "responsável"}</span>
          <button onClick={logout} style={{ padding: "7px 14px", borderRadius: 999, background: C.surfaceAlt, color: C.inkSoft, fontSize: 13, fontWeight: 600 }}>Sair</button>
        </div>
      </div>

      {user.role === "responsavel" || user.role === "RESPONSAVEL" ? (
        <div style={{ maxWidth: 480, margin: "0 auto", padding: "0 20px" }}>
          {children.length > 1 && (
            <select value={activeChildId||""} onChange={e=>setActiveChildId(e.target.value)} style={{ width: "100%", padding: "10px 12px", borderRadius: 10, border: `1px solid ${C.line}`, background: C.surface, fontSize: 14, marginBottom: 14 }}>
              {children.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          )}
          {!activeChild && children.length === 0 && (
            <div style={{ textAlign: "center", padding: "40px 0", color: C.inkSoft }}>
              Nenhuma criança cadastrada ainda.
              <button onClick={()=>setShowAddChild(true)} style={{ display: "block", margin: "12px auto 0", padding: "9px 16px", borderRadius: 9, background: C.teal, color: "#fff", fontWeight: 600, fontSize: 13 }}>Cadastrar meu filho(a)</button>
            </div>
          )}
          {activeChild && (
            <>
              <div style={{ display: "flex", gap: 4, borderBottom: `1px solid ${C.line}`, marginBottom: 20 }}>
                {[["registrar","Registrar"],["historico","Histórico"],["painel","Painel"],["config","Config"]].map(([key,label]) => (
                  <button key={key} onClick={()=>setTab(key)} style={{ padding: "10px 6px", marginRight: 16, background: "transparent", fontSize: 14, fontWeight: 600,
                    color: tab===key?C.ink:C.inkFaint, borderBottom: tab===key?`2px solid ${C.teal}`:"2px solid transparent" }}>{label}</button>
                ))}
              </div>

              {tab === "registrar" && (
                <div>
                  <p style={{ fontSize: 13.5, color: C.inkSoft, marginBottom: 16 }}>Toque para registrar agora — {activeChild.name}</p>
                  <LoggerCard emoji="💧" title="Água" color={C.teal} tint={C.tealTint} open={openLogger==="AGUA"} onToggle={()=>setOpenLogger(openLogger==="AGUA"?null:"AGUA")} options={AGUA_OPTS} onPick={(k)=>addEntry("AGUA",k)} />
                  <div style={{ height: 14 }} />
                  <LoggerCard emoji="🚽" title="Banheiro" color={C.amber} tint={C.amberTint} open={openLogger==="BANHEIRO"} onToggle={()=>setOpenLogger(openLogger==="BANHEIRO"?null:"BANHEIRO")} options={BANHEIRO_OPTS} onPick={(k)=>addEntry("BANHEIRO",k)} />
                  <div style={{ marginTop: 28, padding: 16, borderRadius: 14, background: C.surface, border: `1px solid ${C.line}` }}>
                    <div className="serif" style={{ fontSize: 15, fontWeight: 600, marginBottom: 10 }}>Hoje</div>
                    <div style={{ display: "flex", gap: 20, fontSize: 13.5, color: C.inkSoft }}>
                      <span><b style={{color:C.ink}}>{dailyTotals.agua}</b> copos</span>
                      <span><b style={{color:C.ink}}>{dailyTotals.urina}</b> xixi</span>
                      <span><b style={{color:C.ink}}>{dailyTotals.fezes}</b> cocô</span>
                    </div>
                  </div>
                </div>
              )}

              {tab === "historico" && (
                <div style={{ maxHeight: 560, overflowY: "auto" }}>
                  {historyByDay.length === 0 && <p style={{ color: C.inkSoft, fontSize: 14 }}>Nenhum registro ainda.</p>}
                  {historyByDay.map(([day,list]) => (
                    <div key={day.toDateString()} style={{ marginBottom: 22 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 600, color: C.inkFaint, textTransform: "capitalize", marginBottom: 8 }}>{fmtDateLong(day)}</div>
                      {list.map(e => (
                        <div key={e.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 12px", background: C.surface, borderRadius: 10, marginBottom: 6, border: `1px solid ${C.line}` }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                            <div style={{ width: 8, height: 8, borderRadius: 99, background: e.type==="AGUA"?C.teal:C.amber }} />
                            <span style={{ fontSize: 14 }}>{e.type==="AGUA" ? AGUA_OPTS.find(o=>o.key===e.subtype)?.label : BANHEIRO_OPTS.find(o=>o.key===e.subtype)?.label}</span>
                            <span style={{ fontSize: 12.5, color: C.inkFaint }}>{fmtTime(new Date(e.timestamp))}</span>
                            <span style={{ fontSize: 11, color: C.inkFaint, background: C.surfaceAlt, padding: "2px 6px", borderRadius: 6 }}>{e.createdByName}</span>
                          </div>
                          <div style={{ display: "flex", gap: 10 }}>
                            <button onClick={()=>setEditingEntry(e)} style={{ background: "none", color: C.inkSoft, fontSize: 15 }}>✏️</button>
                            <button onClick={()=>deleteEntry(e.id)} style={{ background: "none", color: C.rose, fontSize: 15 }}>🗑️</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              )}

              {tab === "painel" && (
                <div>
                  <PeriodToggle value={clientPeriod} onChange={setClientPeriod} options={[["diario","Diário"],["mensal","Mensal"]]} />
                  {clientPeriod === "diario" ? (
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 16 }}>
                      <StatCard label="Água hoje" value={`${dailyTotals.agua} copos`} color={C.teal} tint={C.tealTint} />
                      <StatCard label="Xixi hoje" value={dailyTotals.urina} color={C.amber} tint={C.amberTint} />
                      <StatCard label="Cocô hoje" value={dailyTotals.fezes} color={C.amberDark} tint={C.amberTint} />
                    </div>
                  ) : (
                    <div style={{ marginTop: 16, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: 16 }}>
                      <BarChart data={monthlyData} xKey="dia" colorA={C.teal} colorB={C.amber} />
                    </div>
                  )}
                </div>
              )}

              {tab === "config" && (
                <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: 18 }}>
                  <div className="serif" style={{ fontSize: 15, fontWeight: 600, marginBottom: 10 }}>Responsáveis por {activeChild.name}</div>
                  <p style={{ fontSize: 13, color: C.inkSoft, marginBottom: 12 }}>Adicione o outro pai/mãe pra que os dois registrem pelo mesmo filho.</p>
                  <button onClick={()=>setShowAddGuardian(!showAddGuardian)} style={{ padding: "8px 14px", borderRadius: 9, background: C.surfaceAlt, color: C.tealDark, fontWeight: 600, fontSize: 13 }}>+ Adicionar responsável</button>
                  {showAddGuardian && (
                    <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
                      <input value={newGuardian.email} onChange={e=>setNewGuardian({...newGuardian,email:e.target.value})} placeholder="email da conta já criada" style={{ padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13 }} />
                      <select value={newGuardian.parentesco} onChange={e=>setNewGuardian({...newGuardian,parentesco:e.target.value})} style={{ padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13 }}>
                        <option value="MAE">Mãe</option><option value="PAI">Pai</option><option value="OUTRO">Outro</option>
                      </select>
                      <button onClick={addGuardian} style={{ padding: 9, borderRadius: 8, background: C.teal, color: "#fff", fontWeight: 600, fontSize: 13 }}>Vincular</button>
                    </div>
                  )}
                </div>
              )}
              {editingEntry && <EditModal entry={editingEntry} onCancel={()=>setEditingEntry(null)} onSave={saveEditedEntry} />}
            </>
          )}
        </div>
      ) : (
        <div style={{ display: "flex", gap: 24, padding: "0 24px", alignItems: "flex-start", flexWrap: "wrap" }}>
          <div style={{ width: 300, flexShrink: 0, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: 16 }}>
            <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 12 }}>👪 {children.length} crianças cadastradas</div>
            <input value={adminSearch} onChange={e=>setAdminSearch(e.target.value)} placeholder="🔍 Buscar criança" style={{ width: "100%", padding: "8px 10px", borderRadius: 9, border: `1px solid ${C.line}`, fontSize: 13, marginBottom: 12 }} />
            <div style={{ maxHeight: 420, overflowY: "auto" }}>
              {filteredChildren.map(c => (
                <button key={c.id} onClick={()=>setActiveChildId(c.id)} style={{ display: "block", width: "100%", textAlign: "left", padding: "10px 12px", borderRadius: 10, marginBottom: 6, background: activeChildId===c.id?C.tealTint:"transparent" }}>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{c.name}</div>
                  {(c.guardians||[]).map((g,i) => <div key={i} style={{ fontSize: 11.5, color: C.inkFaint }}>{g.name} ({g.parentesco})</div>)}
                </button>
              ))}
            </div>
          </div>
          <div style={{ flex: 1, minWidth: 320 }}>
            {activeChild ? (
              <>
                <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 12, marginBottom: 18 }}>
                  <div>
                    <div className="serif" style={{ fontSize: 22, fontWeight: 600 }}>{activeChild.name}</div>
                    <div style={{ fontSize: 13, color: C.inkSoft }}>{age(activeChild.birthdate)} anos</div>
                  </div>
                  <PeriodToggle value={adminPeriod} onChange={setAdminPeriod} options={[["diario","Diário"],["mensal","Mensal"],["anual","Anual"]]} />
                </div>
                {adminPeriod === "diario" && (
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12, marginBottom: 22 }}>
                    <StatCard label="Água hoje" value={`${dailyTotals.agua} copos`} color={C.teal} tint={C.tealTint} />
                    <StatCard label="Xixi hoje" value={dailyTotals.urina} color={C.amber} tint={C.amberTint} />
                    <StatCard label="Cocô hoje" value={dailyTotals.fezes} color={C.amberDark} tint={C.amberTint} />
                  </div>
                )}
                {adminPeriod === "mensal" && (
                  <div style={{ marginBottom: 22, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: 16 }}><BarChart data={monthlyData} xKey="dia" colorA={C.teal} colorB={C.amber} /></div>
                )}
                {adminPeriod === "anual" && (
                  <div style={{ marginBottom: 22, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: 16 }}><BarChart data={annualData} xKey="mes" colorA={C.teal} colorB={C.amber} /></div>
                )}
                {diagnostico && (
                  <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 16, padding: "6px 18px" }}>
                    <div className="serif" style={{ fontSize: 15, fontWeight: 600, padding: "12px 0 4px" }}>Diagnóstico ({diagnostico.janela})</div>
                    <TrendRow label="Ingestão de água" pct={diagnostico.agua.variacaoPct} />
                    <TrendRow label="Idas ao banheiro" pct={diagnostico.banheiro.variacaoPct} />
                  </div>
                )}
              </>
            ) : <p style={{ color: C.inkSoft }}>Selecione uma criança na lista ao lado.</p>}
          </div>
        </div>
      )}
      <Toast message={toast.msg} error={toast.error} />
    </div>
  );
}

if (ReactDOM.createRoot) { ReactDOM.createRoot(document.getElementById("root")).render(<App />); }
else { ReactDOM.render(<App />, document.getElementById("root")); }
</script>
</body>
</html>
